<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Floating Bubbles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            font-family: 'Arial', sans-serif;
        }

        canvas {
            display: block;
        }

        #cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            border: 2px solid rgba(100, 100, 100, 0.4);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: transform 0.15s ease;
            z-index: 1000;
        }

        #cursor.active {
            transform: translate(-50%, -50%) scale(0.8);
        }
    </style>
</head>
<body>
    <div id="cursor"></div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ============================================
        // 🎨 CONFIGURATION - Easy to tweak!
        // ============================================
        const CONFIG = {
            // Bubble settings
            bubbleCount: 25,
            minSize: 0.3,              // 3D size units
            maxSize: 1.2,

            // Motion settings
            driftSpeed: 0.003,         // Base floating speed in 3D
            friction: 0.98,            // Velocity dampening
            bounceStrength: 0.08,      // How hard bubbles bounce from mouse
            mouseRadius: 2.5,          // Distance at which mouse affects bubbles (REDUCED!)

            // 3D Space boundaries
            spaceWidth: 10,            // Width of the 3D space
            spaceHeight: 8,            // Height of the 3D space
            spaceDepth: 8,             // Depth of the 3D space

            // Animation settings
            scaleOscillation: 0.02,    // How much bubbles "breathe"
            scaleSpeed: 0.02,          // Speed of breathing animation
            cameraAutoRotate: true,    // Gentle camera rotation
            cameraRotateSpeed: 0.0002,

            // Pop animation
            popDuration: 600,          // Pop animation duration (ms)
            popScaleMultiplier: 1.8,   // How much bubble grows when popping
            particleCount: 12,         // Particles created on pop (3D particles!)

            // Color palette (random choice per bubble)
            colors: [
                0xffffff,  // White
                0xc8e5ff,  // Light blue
                0xdac8ff,  // Light purple
                0xffc8e8,  // Light pink
                0xd0f0ff,  // Very light blue
                0xffe0f0,  // Very light pink
            ],

            // Material settings
            bubbleOpacity: 0.6,
            bubbleTransparent: true,
            bubbleReflectivity: 0.9,

            // Visual effects
            fogNear: 4,                // Fog start distance
            fogFar: 15,                // Fog end distance
            depthOfFieldStrength: 0.8, // How much blur for out-of-focus bubbles (0-1)
            focusDistance: 8,          // Distance where bubbles are in perfect focus

            // Respawn settings
            respawnDelay: 500          // Time before respawning after pop (ms)
        };

        // ============================================
        // 🎯 Three.js Scene Setup
        // ============================================
        let scene, camera, renderer, raycaster;
        let bubbles = [];
        let mouse3D = new THREE.Vector3(-1000, -1000, -1000);
        let mouse2D = new THREE.Vector2();
        let cursorEl = document.getElementById('cursor');
        let clock = new THREE.Clock();

        function initScene() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xB8E6F5);  // Light sky blue
            scene.fog = new THREE.Fog(0xE0F6FF, CONFIG.fogNear, CONFIG.fogFar);  // Light blue fog

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.z = 8;
            camera.position.y = 0;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Raycaster for mouse interaction
            raycaster = new THREE.Raycaster();

            // Lighting - soft and diffused for white background
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight1.position.set(5, 5, 5);
            scene.add(directionalLight1);

            const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
            directionalLight2.position.set(-5, -5, -5);
            scene.add(directionalLight2);

            // Point light for extra shine
            const pointLight = new THREE.PointLight(0xffffff, 0.4);
            pointLight.position.set(0, 3, 5);
            scene.add(pointLight);

            // Window resize
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============================================
        // 🎈 3D Bubble Class
        // Structure:
        //   - Position: x, y, z (3D!)
        //   - Size: baseRadius, currentRadius
        //   - Velocity: vx, vy, vz (3D velocity!)
        //   - Mesh: Three.js mesh object
        //   - Drift: for gentle wandering in 3D
        //   - State: popping, particles
        // ============================================
        class Bubble3D {
            constructor(x, y, z, radius) {
                // Position in 3D space
                this.position = new THREE.Vector3(
                    x !== undefined ? x : (Math.random() - 0.5) * CONFIG.spaceWidth,
                    y !== undefined ? y : (Math.random() - 0.5) * CONFIG.spaceHeight,
                    z !== undefined ? z : (Math.random() - 0.5) * CONFIG.spaceDepth
                );

                // Size
                this.baseRadius = radius || (CONFIG.minSize + Math.random() * (CONFIG.maxSize - CONFIG.minSize));
                this.currentRadius = this.baseRadius;

                // Velocity in 3D
                this.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * CONFIG.driftSpeed,
                    (Math.random() - 0.5) * CONFIG.driftSpeed,
                    (Math.random() - 0.5) * CONFIG.driftSpeed
                );

                // Drift for wandering
                this.driftAngle = Math.random() * Math.PI * 2;
                this.driftAngle2 = Math.random() * Math.PI * 2;
                this.driftSpeed = 0.001 + Math.random() * 0.002;

                // Animation
                this.scaleOffset = Math.random() * Math.PI * 2;

                // Color
                const color = CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];

                // Create 3D sphere mesh
                const geometry = new THREE.SphereGeometry(this.baseRadius, 32, 32);
                const material = new THREE.MeshPhysicalMaterial({
                    color: color,
                    transparent: CONFIG.bubbleTransparent,
                    opacity: CONFIG.bubbleOpacity,
                    metalness: 0.1,
                    roughness: 0.1,
                    reflectivity: CONFIG.bubbleReflectivity,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.1,
                });

                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.copy(this.position);
                this.mesh.userData.bubble = this; // Reference back to this bubble
                scene.add(this.mesh);

                // State
                this.popping = false;
                this.popProgress = 0;
                this.particles = [];
                this.color = color;
            }

            // Apply gentle 3D drift
            drift() {
                this.driftAngle += this.driftSpeed;
                this.driftAngle2 += this.driftSpeed * 0.7;

                this.velocity.x += Math.cos(this.driftAngle) * 0.0001;
                this.velocity.y += Math.sin(this.driftAngle2) * 0.0001;
                this.velocity.z += Math.cos(this.driftAngle2) * 0.0001;
            }

            // ============================================
            // 3D Mouse Interaction Logic:
            // 1. Calculate 3D distance from bubble to mouse position
            // 2. If within mouseRadius, apply repelling force
            // 3. Force decreases with distance
            // 4. Apply force in 3D direction away from mouse
            // ============================================
            update(mouse3DPos) {
                if (this.popping) {
                    this.updatePop();
                    return;
                }

                // Gentle drift
                this.drift();

                // Mouse interaction in 3D space
                const distance = this.position.distanceTo(mouse3DPos);

                if (distance < CONFIG.mouseRadius + this.currentRadius) {
                    const force = (CONFIG.mouseRadius + this.currentRadius - distance) / CONFIG.mouseRadius;

                    // Direction away from mouse
                    const direction = new THREE.Vector3()
                        .subVectors(this.position, mouse3DPos)
                        .normalize();

                    // Apply repelling force
                    this.velocity.addScaledVector(direction, force * CONFIG.bounceStrength);
                }

                // Apply velocity
                this.position.add(this.velocity);

                // Friction
                this.velocity.multiplyScalar(CONFIG.friction);

                // Boundary bouncing (soft walls)
                const halfWidth = CONFIG.spaceWidth / 2;
                const halfHeight = CONFIG.spaceHeight / 2;
                const halfDepth = CONFIG.spaceDepth / 2;

                if (Math.abs(this.position.x) > halfWidth - this.currentRadius) {
                    this.position.x = Math.sign(this.position.x) * (halfWidth - this.currentRadius);
                    this.velocity.x *= -0.8;
                }
                if (Math.abs(this.position.y) > halfHeight - this.currentRadius) {
                    this.position.y = Math.sign(this.position.y) * (halfHeight - this.currentRadius);
                    this.velocity.y *= -0.8;
                }
                if (Math.abs(this.position.z) > halfDepth - this.currentRadius) {
                    this.position.z = Math.sign(this.position.z) * (halfDepth - this.currentRadius);
                    this.velocity.z *= -0.8;
                }

                // Breathing animation
                this.scaleOffset += CONFIG.scaleSpeed;
                const scaleVariation = Math.sin(this.scaleOffset) * CONFIG.scaleOscillation;
                this.currentRadius = this.baseRadius * (1 + scaleVariation);

                // Update mesh
                this.mesh.position.copy(this.position);
                this.mesh.scale.setScalar(1 + scaleVariation);

                // Depth of field effect - adjust opacity based on distance from camera
                const distanceFromCamera = camera.position.distanceTo(this.position);
                const focusDistance = CONFIG.focusDistance;
                const depthDifference = Math.abs(distanceFromCamera - focusDistance);

                // Calculate opacity based on depth (closer to focus = more opaque)
                const depthFactor = Math.max(0, 1 - (depthDifference / 5) * CONFIG.depthOfFieldStrength);
                const targetOpacity = CONFIG.bubbleOpacity * (0.3 + depthFactor * 0.7);

                this.mesh.material.opacity = targetOpacity;
            }

            // ============================================
            // Pop Animation in 3D:
            // 1. Create 3D particle spheres
            // 2. Particles shoot out in all 3D directions
            // 3. Main bubble scales up and fades
            // 4. Particles fade and slow down
            // ============================================
            pop() {
                if (this.popping) return;
                this.popping = true;
                this.popProgress = 0;

                // Create 3D particles in a sphere pattern
                for (let i = 0; i < CONFIG.particleCount; i++) {
                    const phi = Math.acos(2 * Math.random() - 1);
                    const theta = Math.random() * Math.PI * 2;

                    const direction = new THREE.Vector3(
                        Math.sin(phi) * Math.cos(theta),
                        Math.sin(phi) * Math.sin(theta),
                        Math.cos(phi)
                    );

                    const particleGeometry = new THREE.SphereGeometry(this.baseRadius * 0.15, 8, 8);
                    const particleMaterial = new THREE.MeshBasicMaterial({
                        color: this.color,
                        transparent: true,
                        opacity: 0.8
                    });

                    const particleMesh = new THREE.Mesh(particleGeometry, particleMaterial);
                    particleMesh.position.copy(this.position);
                    scene.add(particleMesh);

                    this.particles.push({
                        mesh: particleMesh,
                        velocity: direction.multiplyScalar(0.05 + Math.random() * 0.05),
                        life: 1
                    });
                }
            }

            updatePop() {
                this.popProgress += 16.67 / CONFIG.popDuration;

                // Scale up and fade main bubble
                const scale = 1 + (CONFIG.popScaleMultiplier - 1) * this.popProgress;
                const alpha = (1 - this.popProgress) * CONFIG.bubbleOpacity;

                this.mesh.scale.setScalar(scale);
                this.mesh.material.opacity = alpha;

                // Update particles
                this.particles.forEach(p => {
                    p.mesh.position.add(p.velocity);
                    p.velocity.multiplyScalar(0.95);
                    p.life = 1 - this.popProgress;
                    p.mesh.material.opacity = p.life * 0.8;
                    p.mesh.scale.setScalar(p.life);
                });

                if (this.popProgress >= 1) {
                    // Clean up
                    this.particles.forEach(p => scene.remove(p.mesh));
                    this.particles = [];
                    this.popping = false;
                    this.popProgress = 0;
                    return true;
                }
                return false;
            }

            remove() {
                scene.remove(this.mesh);
                this.particles.forEach(p => scene.remove(p.mesh));
            }
        }

        // ============================================
        // 🎮 Initialize Bubbles
        // ============================================
        function initBubbles() {
            bubbles = [];
            for (let i = 0; i < CONFIG.bubbleCount; i++) {
                bubbles.push(new Bubble3D());
            }
        }

        // ============================================
        // 🖱️ Mouse/Touch Events
        // ============================================
        function onMouseMove(event) {
            // Update 2D normalized mouse position
            mouse2D.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse2D.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Update cursor element
            cursorEl.style.left = event.clientX + 'px';
            cursorEl.style.top = event.clientY + 'px';

            // Project mouse to 3D space
            updateMouse3D();
        }

        function updateMouse3D() {
            // Cast ray from camera through mouse position
            raycaster.setFromCamera(mouse2D, camera);

            // Use a plane at z=0 for mouse interaction depth
            const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
            const intersection = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, intersection);

            if (intersection) {
                mouse3D.copy(intersection);
            }
        }

        function onMouseDown(event) {
            cursorEl.classList.add('active');
            handleClick();
        }

        function onMouseUp() {
            cursorEl.classList.remove('active');
        }

        function onMouseLeave() {
            mouse3D.set(-1000, -1000, -1000);
        }

        // ============================================
        // 💥 Click Handler (3D Raycasting!)
        // ============================================
        function handleClick() {
            raycaster.setFromCamera(mouse2D, camera);

            // Check intersection with bubble meshes
            const intersects = raycaster.intersectObjects(
                bubbles.map(b => b.mesh).filter(m => m.parent !== null)
            );

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                const bubble = clickedMesh.userData.bubble;

                if (bubble && !bubble.popping) {
                    bubble.pop();

                    // Schedule respawn
                    setTimeout(() => {
                        const index = bubbles.indexOf(bubble);
                        if (index !== -1) {
                            bubble.remove();
                            bubbles[index] = new Bubble3D();
                        }
                    }, CONFIG.respawnDelay);
                }
            }
        }

        // Event listeners
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mouseup', onMouseUp);
        window.addEventListener('mouseleave', onMouseLeave);

        // Touch events
        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            onMouseMove(touch);
        }, { passive: false });

        window.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            onMouseMove(touch);
            onMouseDown(touch);
        });

        window.addEventListener('touchend', onMouseUp);

        // ============================================
        // 🎬 Animation Loop
        // ============================================
        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = clock.getDelta();

            // Gentle camera auto-rotation
            if (CONFIG.cameraAutoRotate) {
                camera.position.x = Math.sin(clock.elapsedTime * CONFIG.cameraRotateSpeed) * 8;
                camera.position.z = Math.cos(clock.elapsedTime * CONFIG.cameraRotateSpeed) * 8;
                camera.lookAt(0, 0, 0);
            }

            // Update all bubbles
            bubbles.forEach(bubble => {
                bubble.update(mouse3D);
            });

            // Render
            renderer.render(scene, camera);
        }

        // ============================================
        // 🚀 Start
        // ============================================
        initScene();
        initBubbles();
        animate();

        // ============================================
        // 📝 Debug info
        // ============================================
        console.log('%c🎈 3D Interactive Bubbles with Depth of Field!', 'color: #667eea; font-size: 16px; font-weight: bold;');
        console.log('Config:', CONFIG);
        console.log('✨ Features: Sky blue gradient, atmospheric fog, depth of field effect');
        console.log('🎯 Focus distance:', CONFIG.focusDistance, '| Depth of field strength:', CONFIG.depthOfFieldStrength);
        console.log('Click bubbles to pop them in 3D!');
    </script>
</body>
</html>
